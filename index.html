<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171b18">
  <title>Japanese helpers</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --surface: #fff;
      --ink: #23251f;
      --muted: #777970;
      --line: #e7e6df;
      --accent: #356653;
      --shadow: 0 12px 30px rgb(42 45 35 / 14%);
      --selected: #eaf1ec;
      --selected-ink: #254d3e;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --surface: #222923;
      --ink: #edf1eb;
      --muted: #a5afa5;
      --line: #3a443b;
      --accent: #9dceab;
      --shadow: 0 12px 30px rgb(0 0 0 / 35%);
      --selected: #2e4033;
      --selected-ink: #bee4c7;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #f6f5f1; color: var(--ink); }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #6caa83; outline-offset: 2px; }
    .navigation {
      position: fixed;
      z-index: 2;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
    }
    .menu-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .menu-button:hover, .helper-link:hover { border-color: var(--accent); }
    .menu-icon { display: grid; gap: 4px; }
    .menu-icon span { width: 18px; height: 2px; border-radius: 2px; background: currentColor; }
    .menu {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: min(280px, calc(100vw - 24px));
      max-height: calc(100vh - 68px);
      max-height: calc(100dvh - 68px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .menu[hidden] { display: none; }
    .helper-link {
      display: block;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }
    .helper-link[aria-current="page"] { background: var(--selected); color: var(--selected-ink); }
    .helper-name { display: block; font-size: 14px; font-weight: 700; }
    .helper-file { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .helper-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <nav class="navigation" aria-label="Helper navigation">
    <button class="menu-button" id="menuButton" type="button" aria-label="Open helper menu" aria-expanded="false" aria-controls="helperMenu">
      <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <div class="menu" id="helperMenu" hidden>
      <button class="helper-link" type="button" data-file="文字.html">
        <span class="helper-name">Moji</span>
        <span class="helper-file">文字.html</span>
      </button>
      <button class="helper-link" type="button" data-file="言葉.html">
        <span class="helper-name">Kotoba</span>
        <span class="helper-file">言葉.html</span>
      </button>
      <button class="helper-link" type="button" data-file="語彙.html">
        <span class="helper-name">Goi</span>
        <span class="helper-file">語彙.html</span>
      </button>
      <button class="helper-link" type="button" data-file="漢字地図帳.html">
        <span class="helper-name">Kanji Chizuchō</span>
        <span class="helper-file">漢字地図帳.html</span>
      </button>
      <button class="helper-link" type="button" data-file="文解き.html">
        <span class="helper-name">Fumitoki</span>
        <span class="helper-file">文解き.html</span>
      </button>
    </div>
  </nav>
  <iframe class="helper-frame" id="helperFrame" title="Japanese helper"></iframe>

  <script>
    const menuButton = document.getElementById("menuButton");
    const helperMenu = document.getElementById("helperMenu");
    const helperFrame = document.getElementById("helperFrame");
    const helperLinks = [...document.querySelectorAll(".helper-link")];
    const helpers = new Map(helperLinks.map((link) => [link.dataset.file, link]));
    const lastHelperKey = "nihon:last-helper";
    let themeObserver;

    function syncTheme() {
      const theme = helperFrame.contentDocument?.documentElement.dataset.theme;
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    }

    function setMenuOpen(open) {
      helperMenu.hidden = !open;
      menuButton.setAttribute("aria-expanded", String(open));
      menuButton.setAttribute("aria-label", open ? "Close helper menu" : "Open helper menu");
    }

    function loadHelper(filename) {
      const link = helpers.get(filename);
      if (!link) return;
      if (helperFrame.getAttribute("src") !== link.dataset.file) {
        helperFrame.src = link.dataset.file;
      }
      helperFrame.title = `${link.querySelector(".helper-name").textContent} helper`;
      try {
        localStorage.setItem(lastHelperKey, link.dataset.file);
      } catch (error) {
        console.warn("Could not remember the last helper in local storage.", error);
      }
      helperLinks.forEach((item) => {
        if (item === link) item.setAttribute("aria-current", "page");
        else item.removeAttribute("aria-current");
      });
    }

    menuButton.addEventListener("click", () => setMenuOpen(helperMenu.hidden));
    helperMenu.addEventListener("click", (event) => {
      const link = event.target.closest(".helper-link");
      if (!link) return;
      loadHelper(link.dataset.file);
      setMenuOpen(false);
    });
    document.addEventListener("click", (event) => {
      if (!helperMenu.hidden && !helperMenu.contains(event.target) && !menuButton.contains(event.target)) {
        setMenuOpen(false);
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !helperMenu.hidden) {
        setMenuOpen(false);
        menuButton.focus();
      }
    });
    helperFrame.addEventListener("load", () => {
      const helperDocument = helperFrame.contentDocument;
      if (!helperDocument) return;
      themeObserver?.disconnect();
      themeObserver = new MutationObserver(syncTheme);
      themeObserver.observe(helperDocument.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"]
      });
      syncTheme();
    });

    if (location.hash.startsWith("#helper=")) {
      try {
        history.replaceState(null, "", `${location.pathname}${location.search}`);
      } catch (error) {
        console.warn("Could not remove the previous helper URL fragment.", error);
        location.hash = "";
      }
    }
    let storedHelper = null;
    try {
      storedHelper = localStorage.getItem(lastHelperKey);
    } catch (error) {
      console.warn("Could not read the last helper from local storage.", error);
    }
    loadHelper(helpers.has(storedHelper) ? storedHelper : helperLinks[0].dataset.file);
  </script>
</body>
</html>
